<!doctype html>
<html>
<head><meta charset="utf-8"><title>Categories</title></head>
<body>
<h1>Amazon Categories</h1>
<form method="post" action="/categories">
<p>Marketplace <input name="marketplace" value="US"></p>
<p>Node ID <input name="node_id"></p>
<p>Name <input name="name"></p>
<p>Parent ID <input name="parent_id"></p>
<p>Level <input name="level" value="1"></p>
<button type="submit">Save</button>
</form>
<table border="1">
<tr><th>Site</th><th>Name</th><th>Level</th></tr>
{% for item in categories %}
<tr><td>{{ item.marketplace }}</td><td>{{ item.name }}</td><td>{{ item.level }}</td></tr>
{% endfor %}
</table>
</body>
</html>
